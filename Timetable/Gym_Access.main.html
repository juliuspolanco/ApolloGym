<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Gyms - Timetable</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: black;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* Header Styles */
        header {
            border-bottom: 1px solid #1f2937;
        }

        .header-content {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        nav {
            display: flex;
            gap: 1.5rem;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            font-size: 0.875rem;
        }

        .nav-link:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: white;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .nav-link:hover::after {
            transform: scaleX(1);
        }

        .sign-up-btn {
            background-color: white;
            color: black;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sign-up-btn:hover {
            background-color: #2A3439;
            color: white;
        }

        /* Main Content Styles */
        main {
            flex: 1;
            padding: 3rem 0;
        }

        .page-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-title h1 {
            font-size: 2.25rem;
            margin-bottom: 1rem;
        }

        .page-title p {
            color: #9ca3af;
        }

        /* Days Grid */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .day-btn {
            padding: 1rem;
            background-color: #111827;
            border: none;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .day-btn:hover {
            background-color: white;
            color: black;
        }

        .day-btn.active {
            background-color: white;
            color: black;
        }

        /* Class Cards */
        .class-grid {
            display: grid;
            gap: 1rem;
        }

        .class-card {
            background-color: #111827;
            padding: 1.5rem;
            border-radius: 0.5rem;
            transition: transform 0.3s ease;
        }

        .class-card:hover {
            transform: scale(1.02);
        }

        .class-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .class-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #9ca3af;
        }

        .class-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .book-btn {
            background-color: white;
            color: black;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .book-btn:hover {
            background-color: #e5e7eb;
        }

        .intensity-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .intensity-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .intensity-high { background-color: #ef4444; }
        .intensity-medium { background-color: #f59e0b; }
        .intensity-low { background-color: #10b981; }

        /* Opening Hours */
        .opening-hours {
            margin-top: 2rem;
            padding: 1.5rem;
            background-color: #111827;
            border-radius: 0.5rem;
        }

        .hours-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .hours-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .hours-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #1f2937;
        }

        .hours-row span:last-child {
            color: #9ca3af;
        }

        /* Footer Styles */
        footer {
            border-top: 1px solid #1f2937;
            padding: 1rem 0;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            color: #9ca3af;
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
        }

        .footer-link {
            color: #9ca3af;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-link:hover {
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <nav>
                <a href="/Pages/Index.html" class="nav-link">
                    <i data-lucide="home"></i>
                    Home
                </a>
                <a href="/Pages/services/classes.html" class="nav-link">
                    <i data-lucide="dumbbell"></i>
                    Classes
                </a>
                <a href="#" class="nav-link">
                    <i data-lucide="calendar"></i>
                    Timetable
                </a>
                <a href="/Pages/coaching/coaches.html" class="nav-link">
                    <i data-lucide="users"></i>
                    Coaches
                </a>
            </nav>
            <button class="sign-up-btn">Sign Up Now</button>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="page-title">
                <h1>Training Timetable</h1>
                <p>Book your next training session at Apollo Gyms</p>
            </div>

            <div class="days-grid" id="daysGrid"></div>
            <div class="class-grid" id="classGrid"></div>

            <div class="opening-hours">
                <div class="class-header">
                    <i data-lucide="calendar"></i>
                    <h2>Opening Hours</h2>
                </div>
                <div class="hours-grid" id="hoursGrid"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <div>© 2024 Apollo Gyms. All rights reserved.</div>
            <div class="footer-links">
                <a href="/terms" class="footer-link">Terms</a>
                <a href="/privacy" class="footer-link">Privacy</a>
                <a href="/contact" class="footer-link">Contact</a>
            </div>
        </div>
    </footer>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Class types and data
        const classTypes = ['HIIT', 'Strength', 'Boxing', 'Yoga', 'Bodybuilding', 'CrossFit'];
        const trainers = ['John', 'Sarah', 'Mike', 'Emma', 'Alex', 'Lisa'];
        const times = ['06:00', '08:00', '09:30', '17:30', '18:30', '19:00'];
        const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        let selectedDay = 'Monday';

        // Generate random classes
        function generateRandomClasses(count) {
            const classes = [];
            const usedTimes = new Set();

            for (let i = 0; i < count; i++) {
                let time;
                do {
                    time = times[Math.floor(Math.random() * times.length)];
                } while (usedTimes.has(time));
                usedTimes.add(time);

                const classType = classTypes[Math.floor(Math.random() * classTypes.length)];
                const intensity = classType === 'Yoga' ? 'Low' : 
                                ['HIIT', 'CrossFit'].includes(classType) ? 'High' : 'Medium';

                classes.push({
                    id: Math.random(),
                    name: classType,
                    time,
                    trainer: trainers[Math.floor(Math.random() * trainers.length)],
                    duration: '60min',
                    intensity,
                    spots: Math.floor(Math.random() * 8) + 5
                });
            }

            return classes.sort((a, b) => a.time.localeCompare(b.time));
        }

        // Generate schedule for all days
        const schedule = {
            Monday: generateRandomClasses(3),
            Tuesday: generateRandomClasses(3),
            Wednesday: generateRandomClasses(3),
            Thursday: generateRandomClasses(3),
            Friday: generateRandomClasses(3),
            Saturday: generateRandomClasses(2),
            Sunday: generateRandomClasses(2)
        };

        // Render days grid
        function renderDays() {
            const daysGrid = document.getElementById('daysGrid');
            daysGrid.innerHTML = days.map(day => `
                <button class="day-btn ${day === selectedDay ? 'active' : ''}" 
                        onclick="selectDay('${day}')">
                    ${day}
                </button>
            `).join('');
        }

        // Render classes for selected day
        function renderClasses() {
            const classGrid = document.getElementById('classGrid');
            const classes = schedule[selectedDay];

            classGrid.innerHTML = classes.map(classItem => `
                <div class="class-card">
                    <div class="class-header">
                        <div>
                            <h3>${classItem.name}</h3>
                            <div class="class-info">
                                <i data-lucide="clock"></i>
                                <span>${classItem.time} • ${classItem.duration}</span>
                            </div>
                        </div>
                        <div class="class-actions">
                            <div>
                                <p class="text-sm text-gray-400">Trainer</p>
                                <p>${classItem.trainer}</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-400">Spots Left</p>
                                <p>${classItem.spots}</p>
                            </div>
                            <button class="book-btn">Book Class</button>
                        </div>
                    </div>
                    <div class="intensity-indicator">
                        <div class="intensity-dot intensity-${classItem.intensity.toLowerCase()}"></div>
                        <span>${classItem.intensity} Intensity</span>
                    </div>
                </div>
            `).join('');
            
            // Reinitialize icons in new content
            lucide.createIcons();
        }

        // Render opening hours
        function renderHours() {
            const hoursGrid = document.getElementById('hoursGrid');
            hoursGrid.innerHTML = days.map(day => `
                <div class="hours-row">
                    <span>${day}</span>
                    <span>4:00 AM - 11:00 PM</span>
                </div>
            `).join('');
        }

        // Handle day selection
        function selectDay(day) {
            selectedDay = day;
            renderDays();
            renderClasses();
        }

        // Initial render
        renderDays();
        renderClasses();
        renderHours();
    </script>
</body>
</html>
